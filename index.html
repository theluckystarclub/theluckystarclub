```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lucky Star Club ⭐️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #FF649D;
      --white: #FFFFFF;
      --green: #1A7434;
      --yellow: #FFDB4F;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: var(--pink);
      font-family: "Questrial", Arial, sans-serif;
      overflow-x: hidden;
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--pink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: introFade 1.2s ease 4.8s forwards;
    }

    .eight-ball-wrap {
      position: relative;
      width: 330px;
      height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ballFloat 2.5s ease-in-out 3s infinite;
    }

    .eight-ball {
      position: relative;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: #080808;
      box-shadow:
        0 12px 0 rgba(26, 116, 52, 0.18),
        0 20px 35px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ballShake 0.7s ease-in-out 2.3s;
    }

    .eight-ball::after {
      content: "";
      position: absolute;
      top: 24px;
      left: 65px;
      width: 85px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      transform: rotate(-25deg);
    }

    .eight-number {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.25);
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .star {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 165px;
      height: 165px;
      transform: translate(-50%, -50%) scale(0.2) rotate(-12deg);
      opacity: 0;
      animation: starAppear 0.9s cubic-bezier(.2, 1.4, .4, 1) 1.1s forwards;
      filter: drop-shadow(0 5px 0 rgba(255, 219, 79, 0.35));
    }

    .star svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .star-text {
      font-family: "Questrial", Arial, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.5px;
      fill: white;
    }

    .intro-stars {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 30px;
      color: white;
      font-size: 22px;
      letter-spacing: 10px;
      opacity: 0;
      animation: sparkleAppear 0.8s ease 2s forwards;
    }

    .clubhouse {
      min-height: 100vh;
      padding: 70px 24px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .floating-star {
      position: absolute;
      color: white;
      opacity: 0.85;
      pointer-events: none;
      user-select: none;
    }

    .star-one {
      top: 8%;
      left: 10%;
      font-size: 30px;
      transform: rotate(-15deg);
    }

    .star-two {
      top: 17%;
      right: 12%;
      font-size: 20px;
      transform: rotate(20deg);
    }

    .star-three {
      bottom: 18%;
      left: 13%;
      font-size: 24px;
      transform: rotate(12deg);
    }

    .star-four {
      bottom: 10%;
      right: 9%;
      font-size: 34px;
      transform: rotate(-20deg);
    }

    .star-five {
      top: 34%;
      left: 4%;
      font-size: 13px;
    }

    .star-six {
      top: 40%;
      right: 5%;
      font-size: 14px;
    }

    .dots {
      position: absolute;
      color: var(--yellow);
      font-size: 20px;
      letter-spacing: 8px;
      pointer-events: none;
    }

    .dots-one {
      top: 25%;
      left: 8%;
    }

    .dots-two {
      bottom: 28%;
      right: 8%;
    }

    .title {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
      font-size: clamp(48px, 10vw, 100px);
      line-height: 0.82;
      letter-spacing: -3px;
      font-weight: 900;
      text-shadow:
        5px 5px 0 var(--green),
        9px 9px 0 rgba(255, 219, 79, 0.9);
      margin: 0;
    }

    .title-the {
      display: block;
      font-size: 0.43em;
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 8px;
      color: white;
      text-shadow: 3px 3px 0 var(--green);
    }

    .subtitle {
      position: relative;
      z-index: 2;
      margin-top: 35px;
      color: white;
      font-size: clamp(18px, 3vw, 26px);
      letter-spacing: 3px;
      text-align: center;
    }

    .message-card {
      position: relative;
      z-index: 2;
      width: min(560px, 100%);
      margin-top: 42px;
      padding: 32px 28px;
      background: white;
      border: 3px solid var(--green);
      border-radius: 28px;
      box-shadow: 8px 8px 0 var(--yellow);
      text-align: center;
    }

    .message {
      margin: 0 0 22px;
      color: var(--green);
      font-size: 20px;
      line-height: 1.45;
    }

    .join-button {
      display: inline-block;
      width: 100%;
      border: 2px solid var(--green);
      background: white;
      color: var(--green);
      border-radius: 999px;
      padding: 16px 24px;
      font-family: "Questrial", Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .join-button:hover {
      background: white;
      color: var(--green);
      transform: translateY(-3px);
      box-shadow: 4px 4px 0 var(--yellow);
    }

    .footer {
      position: relative;
      z-index: 2;
      margin-top: 35px;
      color: white;
      font-size: 17px;
      letter-spacing: 2px;
      text-align: center;
    }

    @keyframes starAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(-12deg);
      }

      65% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.12) rotate(5deg);
      }

      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    @keyframes ballShake {
      0%, 100% {
        transform: translateX(0) rotate(0);
      }

      20% {
        transform: translateX(-7px) rotate(-2deg);
      }

      40% {
        transform: translateX(7px) rotate(2deg);
      }

      60% {
        transform: translateX(-5px) rotate(-1deg);
      }

      80% {
        transform: translateX(5px) rotate(1deg);
      }
    }

    @keyframes ballFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes sparkleAppear {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.8);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes introFade {
      0% {
        opacity: 1;
        pointer-events: auto;
      }

      100% {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }
    }

    @media (max-width: 600px) {
      .eight-ball-wrap {
        width: 270px;
        height: 270px;
      }

      .eight-ball {
        width: 245px;
        height: 245px;
      }

      .star {
        width: 140px;
        height: 140px;
      }

      .star-text {
        font-size: 8px;
      }

      .intro-stars {
        margin-top: 22px;
        font-size: 18px;
        letter-spacing: 7px;
      }

      .clubhouse {
        padding-top: 55px;
      }

      .title {
        letter-spacing: -2px;
      }

      .message-card {
        padding: 27px 20px;
      }

      .message {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="intro">
    <div class="eight-ball-wrap">
      <div class="eight-ball">

        <div class="eight-number">8</div>

        <div class="star">
          <svg viewBox="0 0 120 120" aria-hidden="true">

            <polygon
              points="60,3 74,43 117,44 83,69 95,111 60,87 25,111 37,69 3,44 46,43"
              fill="#FF649D"

            <text x="60" y="48" text-anchor="middle" class="star-text">HEY</text>
            <text x="60" y="64" text-anchor="middle" class="star-text">STAR</text>
            <text x="60" y="80" text-anchor="middle" class="star-text">GIRL</text>

          </svg>
        </div>

      </div>
    </div>

    <div class="intro-stars">✦ ✧ ⭐️ ✧ ✦</div>
  </div>


  <main class="clubhouse">

    <div class="floating-star star-one">✦</div>
    <div class="floating-star star-two">✧</div>
    <div class="floating-star star-three">★</div>
    <div class="floating-star star-four">✦</div>
    <div class="floating-star star-five">✧</div>
    <div class="floating-star star-six">✦</div>

    <div class="dots dots-one">• • •</div>
    <div class="dots dots-two">• • •</div>


    <h1 class="title">
      <span class="title-the">THE</span>
      LUCKY STAR<br>
      CLUB
    </h1>


    <div class="subtitle">
      Dream. Create. Connect.
    </div>


    <section class="message-card">

      <p class="message">
        The clubhouse is under construction…<br>
        Sign up below and we'll send you the invitation when we go cosmic.
      </p>

      <a
        class="join-button"
        href="https://tally.so/r/D4jyzj"
        target="_blank"
        rel="noopener noreferrer"
      >
        COUNT ME IN ⭐️
      </a>

    </section>


    <div class="footer">
      ✦ count your lucky stars ✦
    </div>

  </main>

</body>
</html>
```
